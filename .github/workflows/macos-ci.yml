name: EchoType CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on macOS 26
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture and Xcode SDK
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf 'macOS SDK: %s\n' "$sdk_version"
          sdk_major="${sdk_version%%.*}"
          test "$sdk_major" -ge 26
      - name: Create generated speech sample
        run: say -o "$RUNNER_TEMP/echotype-sample.aiff" "Echo Type stores my speech on this Mac."
      - name: Run tests
        env:
          ECHOTYPE_TEST_AUDIO: ${{ runner.temp }}/echotype-sample.aiff
        run: swift test
      - name: Build, package, and verify native app
        run: bash Scripts/package-app.sh
      - name: Launch packaged app from a clean location without .build
        run: bash Scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EchoType-${{ github.run_number }}
          path: |
            dist/EchoType.zip
            dist/EchoType.zip.sha256
          if-no-files-found: error
          retention-days: 30

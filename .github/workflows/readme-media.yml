name: README media

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Capture the published release app and prepare README media
        env:
          APP_KEY: echotype
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/capture-readme-media.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echotype-readme-media
          path: |
            docs/images/echotype-light.png
            docs/images/echotype-dark.png
            docs/images/echotype-model-library-light.png
            docs/images/echotype-hero.gif
            docs/images/social-preview.png
            ${{ runner.temp }}/readme-media/*
          if-no-files-found: warn
          retention-days: 14

name: Temporary README screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest released app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/readme-images"
          curl --fail --location --silent --show-error \
            https://github.com/9phfr6dsw4-dotcom/echotype/releases/latest/download/EchoType.zip \
            --output "$RUNNER_TEMP/EchoType.zip"
          ditto -x -k "$RUNNER_TEMP/EchoType.zip" "$RUNNER_TEMP/app"
      - name: Seed public demo transcript and capture the app
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/capture.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          import ImageIO
          import UniformTypeIdentifiers
          import Foundation
          let args = CommandLine.arguments
          guard args.count == 3 else { fatalError("owner and output required") }
          let owner = args[1]
          let output = URL(fileURLWithPath: args[2])
          let windows = (CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]]) ?? []
          guard let row = windows.first(where: { ($0[kCGWindowOwnerName] as? String) == owner && ($0[kCGWindowLayer] as? Int ?? 0) == 0 }),
                let number = row[kCGWindowNumber] as? CGWindowID,
                let image = CGWindowListCreateImage(.null, .optionIncludingWindow, number, [.boundsIgnoreFraming, .bestResolution]),
                let destination = CGImageDestinationCreateWithURL(output as CFURL, UTType.png.identifier as CFString, 1, nil) else {
            fputs("Could not capture a visible window for \(owner)\n", stderr); exit(1)
          }
          CGImageDestinationAddImage(destination, image, nil)
          guard CGImageDestinationFinalize(destination) else { exit(2) }
          SWIFT
          APP="$RUNNER_TEMP/app/EchoType.app"
          test -d "$APP"
          mkdir -p "$HOME/Library/Application Support/EchoTypeTranscriptHistory"
          python3 - <<'PY'
          import json, os, time, uuid
          now = time.time()
          records = [
            {"id": str(uuid.uuid4()), "text": "The best ideas start with a clear note. Capture the thought, refine it later, and keep your focus on the work in front of you.", "timestamp": now - 1800, "duration": 12.4, "modelID": "apple-speech"},
            {"id": str(uuid.uuid4()), "text": "A good release checklist makes each step easy to review: test the app, verify the archive, and share the download.", "timestamp": now - 600, "duration": 10.1, "modelID": "apple-speech"}
          ]
          path = os.path.expanduser("~/Library/Application Support/EchoTypeTranscriptHistory/transcripts.json")
          with open(path, "w", encoding="utf-8") as f: json.dump(records, f)
          PY
          defaults write com.echotype.app EchoType.hasSeenLaunchAtLoginOption -bool true
          open "$APP"
          sleep 10
          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")"
          [[ "$ICON_NAME" == *.icns ]] || ICON_NAME="$ICON_NAME.icns"
          sips -s format png "$APP/Contents/Resources/$ICON_NAME" --out "$RUNNER_TEMP/readme-images/echotype-icon.png" >/dev/null
          swift "$RUNNER_TEMP/capture.swift" EchoType "$RUNNER_TEMP/readme-images/echotype-window.png"
      - uses: actions/upload-artifact@v4
        with:
          name: echotype-readme-images
          path: ${{ runner.temp }}/readme-images/*.png
          if-no-files-found: error
          retention-days: 7

name: Whisper tiny real-inference benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whisper-benchmark:
    name: Pinned compiled tiny model on macOS 26
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Download and verify pinned compiled model and tokenizer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 Scripts/benchmark-whisper.py \
            --directory "$RUNNER_TEMP/whisper-tiny-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Generate public synthetic speech (runner temp only)
        run: |
          say -o "$RUNNER_TEMP/whisper-sample.aiff" \
            "The quick brown fox jumps over the lazy dog."
          afconvert -f WAVE -d LEI16@16000 -c 1 \
            "$RUNNER_TEMP/whisper-sample.aiff" "$RUNNER_TEMP/whisper-sample.wav"
      - name: Run opt-in uncached versus cache-hit real inference
        env:
          ECHOTYPE_WHISPER_MODEL_DIRECTORY: ${{ runner.temp }}/whisper-tiny-${{ github.run_id }}-${{ github.run_attempt }}
          ECHOTYPE_WHISPER_BENCH_AUDIO: ${{ runner.temp }}/whisper-sample.wav
        run: swift test --filter WhisperPerformanceTests
